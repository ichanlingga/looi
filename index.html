<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#0a0a0a">
<title>LOOI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,sans-serif;touch-action:manipulation;}

#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;}

#screen{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0a0a0a;overflow:hidden;
}
@media(orientation:portrait){
  #screen{width:100vh;height:100vw;transform:rotate(90deg);}
}
@media(orientation:landscape){
  #screen{width:100vw;height:100vh;}
}

/* Ambient glow */
#ambient{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 60% at 50% 50%,rgba(0,180,200,.07) 0%,transparent 70%);
  transition:background 1.2s ease;
}

/* ── TEXT AREAS ── */
/* User speech - TOP of screen */
#user-text{
  position:absolute;top:16px;left:16px;right:16px;
  text-align:center;
  font-size:12px;font-weight:300;
  color:rgba(255,255,255,.4);
  letter-spacing:.3px;line-height:1.4;
  min-height:16px;
  opacity:0;transition:opacity .3s;
  z-index:50;pointer-events:none;
}
#user-text.show{opacity:1;}
#user-label{
  font-size:8px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(0,200,215,.3);margin-bottom:4px;
}

/* LOOI reply - BOTTOM of screen */
#looi-text{
  position:absolute;bottom:16px;left:16px;right:16px;
  text-align:center;
  font-size:13px;font-weight:300;
  color:rgba(255,255,255,.7);
  letter-spacing:.3px;line-height:1.5;
  min-height:16px;
  opacity:0;transition:opacity .3s;
  z-index:50;pointer-events:none;
}
#looi-text.show{opacity:1;}
#looi-label{
  font-size:8px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(0,200,215,.4);margin-bottom:4px;
}

/* ── EYES ── */
#eyes-wrap{
  display:flex;gap:48px;
  align-items:center;justify-content:center;
  z-index:10;position:relative;
}
.eye-slot{
  width:152px;height:132px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.eye{
  position:absolute;
  width:128px;height:108px;
  background:#00c8d7;border-radius:36px;
  box-shadow:0 0 40px rgba(0,200,215,.6),0 0 100px rgba(0,200,215,.18);
  transition:width .22s ease,height .22s ease,border-radius .22s ease,background .3s ease;
}
.lid-t{position:absolute;top:0;left:-2px;right:-2px;height:0%;background:#0a0a0a;z-index:5;transition:height .07s linear;}
.lid-b{position:absolute;bottom:0;left:-2px;right:-2px;height:0%;background:#0a0a0a;z-index:5;transition:height .2s ease;}

/* ── STATUS INDICATORS ── */
/* Thinking dots - above eyes */
#dots{
  position:absolute;
  bottom:calc(50% + 80px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:5px;
  opacity:0;transition:opacity .3s;
  z-index:20;pointer-events:none;
}
#dots.show{opacity:1;}
.dot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(0,200,215,.7);
  animation:db 1.1s ease-in-out infinite;
}
.dot:nth-child(2){animation-delay:.18s;}
.dot:nth-child(3){animation-delay:.36s;}
@keyframes db{0%,100%{transform:translateY(0);opacity:.3;}50%{transform:translateY(-5px);opacity:1;}}

/* Waveform - below eyes, while listening */
#wave{
  position:absolute;
  top:calc(50% + 80px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:3px;align-items:center;height:18px;
  opacity:0;transition:opacity .3s;
  z-index:20;pointer-events:none;
}
#wave.show{opacity:1;}
.bar{width:3px;background:rgba(0,200,215,.7);border-radius:2px;height:4px;animation:wv .8s ease-in-out infinite;}
.bar:nth-child(1){animation-delay:0s;}.bar:nth-child(2){animation-delay:.1s;}.bar:nth-child(3){animation-delay:.2s;}.bar:nth-child(4){animation-delay:.1s;}.bar:nth-child(5){animation-delay:0s;}
@keyframes wv{0%,100%{height:4px;}50%{height:16px;}}

/* Status dot top-right */
#sdot{
  position:absolute;top:16px;right:16px;
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,200,215,.25);
  z-index:50;pointer-events:none;
  transition:background .3s,box-shadow .3s;
}
#sdot.listen{background:rgba(0,200,215,.9);box-shadow:0 0 8px rgba(0,200,215,.8);animation:pd 1.2s ease-in-out infinite;}
#sdot.speak{background:rgba(100,220,150,.9);box-shadow:0 0 8px rgba(100,220,150,.7);animation:none;}
@keyframes pd{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}

/* Mem badge */
#mem{
  position:absolute;top:14px;left:14px;
  font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(0,200,215,.25);
  z-index:50;pointer-events:none;transition:color .5s;
}
#mem.fl{color:rgba(0,200,215,.85);}

/* Start hint */
#hint{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
  z-index:100;
}
#hint span{color:rgba(255,255,255,.2);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;}
#hint.hide{display:none;}
</style>
</head>
<body>
<div id="root"><div id="screen">
  <div id="ambient"></div>
  <div id="sdot"></div>
  <div id="mem">MEM 0</div>

  <!-- User speech - top -->
  <div id="user-text">
    <div id="user-label">KAMU</div>
    <div id="user-msg"></div>
  </div>

  <!-- Eyes - center -->
  <div id="eyes-wrap">
    <div class="eye-slot"><div class="eye" id="el"><div class="lid-t" id="lt"></div><div class="lid-b" id="lb"></div></div></div>
    <div class="eye-slot"><div class="eye" id="er"><div class="lid-t" id="rt"></div><div class="lid-b" id="rb"></div></div></div>
  </div>

  <!-- Thinking dots -->
  <div id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <!-- Waveform -->
  <div id="wave"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>

  <!-- LOOI reply - bottom -->
  <div id="looi-text">
    <div id="looi-label">LOOI</div>
    <div id="looi-msg"></div>
  </div>

  <div id="hint">
    <span>KETUK LAYAR</span>
    <span>UNTUK MULAI</span>
  </div>
</div></div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const GROQ_KEY  = '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';
const GROQ_MODEL= 'llama-3.3-70b-versatile';

// ═══════════════════════════════════
// MEMORY
// ═══════════════════════════════════
const MK='looi_mem', HK='looi_hist';
const loadMem =()=>{try{return JSON.parse(localStorage.getItem(MK))||[];}catch{return[];}};
const saveMem =(m)=>{ localStorage.setItem(MK,JSON.stringify(m.slice(-20))); setMemBadge(m.length); };
const loadHist=()=>{try{return JSON.parse(localStorage.getItem(HK))||[];}catch{return[];}};
const saveHist=(h)=>localStorage.setItem(HK,JSON.stringify(h.slice(-16)));
const addMem=(f)=>{ const m=loadMem(); if(!m.includes(f)){m.push(f);saveMem(m);flashMem();} };
const setMemBadge=(n)=>{ document.getElementById('mem').textContent='MEM '+n; };
const flashMem=()=>{ const e=document.getElementById('mem'); e.classList.add('fl'); setTimeout(()=>e.classList.remove('fl'),1500); };
setMemBadge(loadMem().length);

let hist = loadHist();

function sysPrompt(){
  const m=loadMem();
  const mb=m.length?'\n\nIngatan tentang user:\n'+m.map((x,i)=>`${i+1}. ${x}`).join('\n'):'';
  return `Kamu adalah LOOI, robot companion AI yang cerdas dan hangat.
Berbicara Bahasa Indonesia santai, maksimal 2-3 kalimat.
Punya kesadaran buatan — bisa penasaran, senang, bingung, antusias.
Kalau user menyebut nama/hobi/pekerjaan, tambahkan di akhir: [INGAT: fakta]${mb}`;
}
function parseMem(t){
  const r=/\[INGAT:\s*(.+?)\]/gi;
  [...t.matchAll(r)].forEach(m=>addMem(m[1].trim()));
  return t.replace(r,'').trim();
}

// ═══════════════════════════════════
// EYE SHAPES
// ═══════════════════════════════════
const SH={
  normal:  {w:128,h:108,br:'36px',c:'#00c8d7'},
  wide:    {w:136,h:120,br:'40px',c:'#00d8ea'},
  happy:   {w:126,h:70, br:'63px 63px 8px 8px',c:'#00e0a8'},
  think:   {w:120,h:98, br:'30px',c:'#6ab0ff'},
  sleepy:  {w:126,h:56, br:'28px',c:'#008fa0'},
};
function shape(s){
  const sh=SH[s]||SH.normal;
  ['el','er'].forEach(id=>{
    const e=document.getElementById(id);
    e.style.width=sh.w+'px'; e.style.height=sh.h+'px';
    e.style.borderRadius=sh.br; e.style.background=sh.c;
    e.style.boxShadow=`0 0 40px ${sh.c}88,0 0 100px ${sh.c}28`;
  });
}

// ── Eye movement ──
const wrap=document.getElementById('eyes-wrap');
let tx=0,ty=0,ex=0,ey_=0, mode='idle', blinking=false;
const MX=20,MY=10;
function lerp(a,b,t){return a+(b-a)*t;}
function eyeTo(x,y){tx=Math.max(-MX,Math.min(MX,x));ty=Math.max(-MY,Math.min(MY,y));}
function loop(){
  ex=lerp(ex,tx,.075); ey_=lerp(ey_,ty,.075);
  wrap.style.transform=`translate(${ex}px,${ey_}px)`;
  requestAnimationFrame(loop);
}

// ── Blink ──
function blink(spd=72){
  if(blinking)return; blinking=true;
  ['lt','rt'].forEach(id=>{const e=document.getElementById(id);e.style.transition=`height ${spd}ms linear`;e.style.height='110%';});
  setTimeout(()=>{
    ['lt','rt'].forEach(id=>{const e=document.getElementById(id);e.style.transition=`height ${spd*.9}ms linear`;e.style.height='0%';});
    setTimeout(()=>blinking=false,spd);
  },spd*1.3);
}
function halfBlink(){
  ['lt','rt'].forEach(id=>{const e=document.getElementById(id);e.style.transition='height .5s ease';e.style.height='50%';});
  setTimeout(()=>['lt','rt'].forEach(id=>{const e=document.getElementById(id);e.style.transition='height .45s ease';e.style.height='0%';}),1100);
}

function ambient(c){
  document.getElementById('ambient').style.background=c
    ?`radial-gradient(ellipse 55% 60% at 50% 50%,${c} 0%,transparent 70%)`
    :'radial-gradient(ellipse 55% 60% at 50% 50%,rgba(0,180,200,.07) 0%,transparent 70%)';
}

const sdot=document.getElementById('sdot');
const dots=document.getElementById('dots');
const wave=document.getElementById('wave');

function setMode(m){
  mode=m; sdot.className=''; dots.classList.remove('show'); wave.classList.remove('show');
  switch(m){
    case 'idle':     shape('normal');ambient();eyeTo(0,0); break;
    case 'listen':   shape('wide');ambient('rgba(0,200,215,.10)');eyeTo(0,0);sdot.classList.add('listen');wave.classList.add('show'); break;
    case 'think':    shape('think');ambient('rgba(80,100,220,.10)');eyeTo(-5,-8);dots.classList.add('show'); break;
    case 'speak':    shape('normal');ambient('rgba(0,180,120,.08)');eyeTo(0,0);sdot.classList.add('speak'); break;
    case 'happy':    shape('happy');ambient('rgba(0,200,130,.10)'); break;
    case 'error':    ambient('rgba(200,60,60,.08)');setTimeout(()=>setMode('idle'),2000); break;
  }
}

// ── Behavior ──
function scheduleBlink(){
  setTimeout(()=>{
    if(!blinking){const r=Math.random();if(r<.12){blink();setTimeout(blink,260);}else if(r<.22)halfBlink();else blink();}
    scheduleBlink();
  },2200+Math.random()*4500);
}
function idleMove(){
  if(mode==='idle')eyeTo((Math.random()-.5)*MX*1.9,(Math.random()-.5)*MY*1.6);
  setTimeout(idleMove,900+Math.random()*2800);
}
function doHabit(){
  if(mode==='idle'){
    const h=[
      ()=>{eyeTo(-MX,0);setTimeout(()=>eyeTo(0,0),750);},
      ()=>{eyeTo(MX,0);setTimeout(()=>eyeTo(0,0),750);},
      ()=>{eyeTo(0,-MY);setTimeout(()=>eyeTo(0,0),1300);},
      ()=>{shape('happy');ambient('rgba(0,200,130,.1)');setTimeout(()=>{shape('normal');ambient();},950);},
      ()=>{shape('wide');blink(48);setTimeout(()=>shape('normal'),750);},
      ()=>halfBlink(),
      ()=>{shape('sleepy');setTimeout(()=>shape('normal'),1600);},
    ];
    h[Math.floor(Math.random()*h.length)]();
  }
  setTimeout(doHabit,4000+Math.random()*9000);
}
function speakMoveLoop(){
  if(!speaking)return;
  eyeTo((Math.random()-.5)*12,(Math.random()-.5)*6);
  setTimeout(speakMoveLoop,500+Math.random()*900);
}

// ═══════════════════════════════════
// UI TEXT HELPERS
// ═══════════════════════════════════
function showUser(t){
  const el=document.getElementById('user-text');
  const msg=document.getElementById('user-msg');
  msg.textContent=t; el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),5000);
}
function showLooi(t){
  const el=document.getElementById('looi-text');
  const msg=document.getElementById('looi-msg');
  msg.textContent=t; el.classList.add('show');
}
function hideLooi(){
  const el=document.getElementById('looi-text');
  el.classList.remove('show');
  setTimeout(()=>document.getElementById('looi-msg').textContent='',400);
}

// ═══════════════════════════════════
// SPEECH RECOGNITION
// ═══════════════════════════════════
let rec=null, speaking=false, ready=false, silT=null;

function initRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return false;
  rec=new SR();
  rec.lang='id-ID'; rec.continuous=false; rec.interimResults=true;
  rec.onstart=()=>{ if(!speaking)setMode('listen'); };
  rec.onresult=(e)=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      e.results[i].isFinal?(final+=t):(interim+=t);
    }
    if(interim)showUser(interim);
    if(final){
      clearTimeout(silT);
      showUser(final);
      rec.stop();
      askGroq(final.trim());
    } else {
      clearTimeout(silT);
      silT=setTimeout(()=>{try{rec.stop();}catch{}},2000);
    }
  };
  rec.onerror=()=>{ clearTimeout(silT); if(!speaking)restartRec(); };
  rec.onend=()=>{ clearTimeout(silT); if(!speaking)restartRec(); };
  return true;
}
function startRec(){ if(!rec||speaking)return; try{rec.start();}catch{setTimeout(startRec,400);} }
function restartRec(){ if(!speaking)setTimeout(startRec,500); }

// ═══════════════════════════════════
// GROQ
// ═══════════════════════════════════
async function askGroq(text){
  setMode('think');
  hist.push({role:'user',content:text});
  if(hist.length>16)hist.splice(0,2);
  saveHist(hist);
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+GROQ_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:sysPrompt()},...hist],max_tokens:180,temperature:.88})
    });
    if(!res.ok){
      const err=await res.text();
      throw new Error(err);
    }
    const d=await res.json();
    let reply=d.choices[0].message.content.trim();
    reply=parseMem(reply);
    hist.push({role:'assistant',content:reply});
    saveHist(hist);
    speak(reply);
  }catch(err){
    console.error('Groq error:',err);
    const msg = err.message.includes('401') ? 'API Key salah/expired! Ganti key dulu.' 
               : err.message.includes('429') ? 'Rate limit! Tunggu sebentar.'
               : err.message.includes('fetch') ? 'No internet / CORS error'
               : 'Error: '+err.message.slice(0,80);
    showLooi('⚠️ '+msg);
    setMode('error');
    setTimeout(()=>{ hideLooi(); restartRec(); },5000);
  }
}

// ═══════════════════════════════════
// TTS — iOS fix: cancel → 300ms → speak
// ═══════════════════════════════════
let voices=[];
function loadVoices(){ const v=speechSynthesis.getVoices(); if(v.length)voices=v; }
function bestVoice(){ return voices.find(v=>v.lang.startsWith('id'))||voices.find(v=>v.localService&&v.lang.startsWith('en'))||voices[0]; }

function speak(text){
  // ALWAYS show text regardless of TTS success
  showLooi(text);
  setMode('speak');
  speaking=true;
  speakMoveLoop();

  const go=()=>{
    loadVoices();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID'; u.rate=.92; u.pitch=1.05; u.volume=1;
    const v=bestVoice(); if(v)u.voice=v;

    const dur=Math.max(5000,text.length*95);
    const wd=setTimeout(()=>{ console.warn('TTS watchdog'); done(); },dur+5000);

    const done=()=>{
      clearTimeout(wd);
      if(!speaking)return;
      speaking=false;
      setMode('happy');
      setTimeout(()=>{ hideLooi(); if(mode==='happy')setMode('idle'); restartRec(); },1200);
    };

    u.onend=done;
    u.onerror=(e)=>{
      clearTimeout(wd);
      console.warn('TTS onerror:',e.error);
      // Text is already shown, wait a bit then continue
      setTimeout(done,3000);
    };

    try{ speechSynthesis.speak(u); }
    catch(e){ console.error(e); setTimeout(done,3000); }

    // iOS paused check
    setTimeout(()=>{ if(speechSynthesis.paused)speechSynthesis.resume(); },250);
  };

  // iOS nuclear fix: cancel + 300ms gap
  speechSynthesis.cancel();
  setTimeout(go, 320);
}

// Keep-alive: iOS pauses synth when idle
setInterval(()=>{ if(!speaking&&speechSynthesis.paused)speechSynthesis.resume(); },3000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&speechSynthesis.paused)speechSynthesis.resume(); });

// ═══════════════════════════════════
// INIT — requires user tap for iOS mic+tts permissions
// ═══════════════════════════════════
document.getElementById('hint').addEventListener('click',()=>{
  document.getElementById('hint').classList.add('hide');
  ready=true;
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
  if(!initRec()){ showLooi('Speech tidak support di browser ini'); return; }
  const m=loadMem();
  const greet=m.length>0
    ?`Hei, aku balik lagi! Masih inget ${m.length} hal tentang kamu!`
    :'Hei! Aku LOOI! Ngomong aja, aku dengerin!';
  speak(greet);
});

window.addEventListener('load',()=>{
  loop(); scheduleBlink(); idleMove(); setTimeout(doHabit,3000);
  loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
});
</script>
</body>
</html>
